<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track your daily calorie intake with this beautiful, easy-to-use calorie tracker. Set goals, log meals, and monitor your nutrition progress.">
    <title>CaloriQ — Smart Calorie Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Ambient background blobs -->
        <div class="ambient-bg">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <!-- Header -->
        <header class="app-header" id="app-header">
            <div class="header-left">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
                        <circle cx="16" cy="16" r="14" stroke="url(#logo-grad)" stroke-width="2.5"/>
                        <path d="M16 8 C16 8, 22 13, 22 17 C22 20.3 19.3 23 16 23 C12.7 23 10 20.3 10 17 C10 13 16 8 16 8Z" fill="url(#logo-grad)"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32">
                                <stop offset="0%" stop-color="#f97316"/>
                                <stop offset="100%" stop-color="#ef4444"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <h1 class="logo-text">CaloriQ</h1>
                </div>
            </div>
            <div class="header-right">
                <div class="date-display" id="date-display"></div>
                <button class="btn-icon" id="btn-settings" aria-label="Settings" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Stats Row -->
            <section class="stats-row" id="stats-row">
                <div class="stat-card stat-consumed" id="stat-consumed">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
                            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
                            <line x1="6" y1="1" x2="6" y2="4"/>
                            <line x1="10" y1="1" x2="10" y2="4"/>
                            <line x1="14" y1="1" x2="14" y2="4"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Consumed</span>
                        <span class="stat-value" id="total-consumed">0</span>
                        <span class="stat-unit">kcal</span>
                    </div>
                </div>
                <div class="stat-card stat-remaining" id="stat-remaining">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                            <polyline points="17 6 23 6 23 12"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Remaining</span>
                        <span class="stat-value" id="total-remaining">2000</span>
                        <span class="stat-unit">kcal</span>
                    </div>
                </div>
                <div class="stat-card stat-goal" id="stat-goal-card">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <circle cx="12" cy="12" r="6"/>
                            <circle cx="12" cy="12" r="2"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Daily Goal</span>
                        <span class="stat-value" id="daily-goal-display">2000</span>
                        <span class="stat-unit">kcal</span>
                    </div>
                </div>
            </section>

            <!-- Progress Ring Section -->
            <section class="progress-section" id="progress-section">
                <div class="progress-ring-container">
                    <svg class="progress-ring" viewBox="0 0 200 200">
                        <defs>
                            <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#f97316"/>
                                <stop offset="50%" stop-color="#ef4444"/>
                                <stop offset="100%" stop-color="#ec4899"/>
                            </linearGradient>
                            <linearGradient id="progress-over" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ef4444"/>
                                <stop offset="100%" stop-color="#dc2626"/>
                            </linearGradient>
                        </defs>
                        <circle class="progress-ring-bg" cx="100" cy="100" r="85" />
                        <circle class="progress-ring-fill" id="progress-ring-fill" cx="100" cy="100" r="85" />
                    </svg>
                    <div class="progress-ring-text">
                        <span class="progress-percentage" id="progress-percentage">0%</span>
                        <span class="progress-subtitle">of daily goal</span>
                    </div>
                </div>
            </section>

            <!-- Meal Categories -->
            <section class="meals-section" id="meals-section">
                <div class="section-header">
                    <h2 class="section-title">Today's Meals</h2>
                    <button class="btn-add-meal" id="btn-add-meal" aria-label="Add meal entry">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        <span>Add Entry</span>
                    </button>
                </div>

                <!-- Meal Category Cards -->
                <div class="meal-categories" id="meal-categories">
                    <div class="meal-category" data-category="breakfast" id="category-breakfast">
                        <div class="category-header">
                            <div class="category-icon breakfast-icon">🌅</div>
                            <div class="category-info">
                                <h3>Breakfast</h3>
                                <span class="category-calories" id="breakfast-calories">0 kcal</span>
                            </div>
                            <button class="btn-expand" aria-label="Expand breakfast entries">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                        </div>
                        <div class="category-items" id="breakfast-items"></div>
                    </div>

                    <div class="meal-category" data-category="lunch" id="category-lunch">
                        <div class="category-header">
                            <div class="category-icon lunch-icon">☀️</div>
                            <div class="category-info">
                                <h3>Lunch</h3>
                                <span class="category-calories" id="lunch-calories">0 kcal</span>
                            </div>
                            <button class="btn-expand" aria-label="Expand lunch entries">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                        </div>
                        <div class="category-items" id="lunch-items"></div>
                    </div>

                    <div class="meal-category" data-category="dinner" id="category-dinner">
                        <div class="category-header">
                            <div class="category-icon dinner-icon">🌙</div>
                            <div class="category-info">
                                <h3>Dinner</h3>
                                <span class="category-calories" id="dinner-calories">0 kcal</span>
                            </div>
                            <button class="btn-expand" aria-label="Expand dinner entries">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                        </div>
                        <div class="category-items" id="dinner-items"></div>
                    </div>

                    <div class="meal-category" data-category="snacks" id="category-snacks">
                        <div class="category-header">
                            <div class="category-icon snacks-icon">🍎</div>
                            <div class="category-info">
                                <h3>Snacks</h3>
                                <span class="category-calories" id="snacks-calories">0 kcal</span>
                            </div>
                            <button class="btn-expand" aria-label="Expand snack entries">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                        </div>
                        <div class="category-items" id="snacks-items"></div>
                    </div>
                </div>
            </section>

            <!-- Weekly Overview -->
            <section class="weekly-section" id="weekly-section">
                <div class="section-header">
                    <h2 class="section-title">Weekly Overview</h2>
                </div>
                <div class="weekly-chart" id="weekly-chart"></div>
            </section>

            <!-- History Section -->
            <section class="history-section" id="history-section">
                <div class="section-header">
                    <h2 class="section-title">Recent History</h2>
                    <button class="btn-clear-history" id="btn-clear-history" aria-label="Clear all history">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        <span>Clear All</span>
                    </button>
                </div>
                <div class="history-list" id="history-list">
                    <div class="empty-state" id="empty-history">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                        <p>No entries yet. Start tracking your meals!</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add Meal Modal -->
    <div class="modal-overlay" id="modal-add-meal">
        <div class="modal" role="dialog" aria-labelledby="modal-title-add">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title-add">Add Meal Entry</h2>
                <button class="btn-close-modal" id="btn-close-add-modal" aria-label="Close modal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form class="modal-body" id="form-add-meal">
                <div class="form-group">
                    <label for="input-food-name">Food Name</label>
                    <input type="text" id="input-food-name" placeholder="e.g. Grilled Chicken Salad" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="input-calories">Calories (kcal)</label>
                    <input type="number" id="input-calories" placeholder="e.g. 350" min="1" max="10000" required>
                </div>
                <div class="form-group">
                    <label for="input-meal-category">Meal Category</label>
                    <div class="category-selector" id="input-meal-category">
                        <button type="button" class="cat-btn active" data-cat="breakfast">🌅 Breakfast</button>
                        <button type="button" class="cat-btn" data-cat="lunch">☀️ Lunch</button>
                        <button type="button" class="cat-btn" data-cat="dinner">🌙 Dinner</button>
                        <button type="button" class="cat-btn" data-cat="snacks">🍎 Snacks</button>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="input-protein">Protein (g)</label>
                        <input type="number" id="input-protein" placeholder="0" min="0" max="500">
                    </div>
                    <div class="form-group">
                        <label for="input-carbs">Carbs (g)</label>
                        <input type="number" id="input-carbs" placeholder="0" min="0" max="500">
                    </div>
                    <div class="form-group">
                        <label for="input-fat">Fat (g)</label>
                        <input type="number" id="input-fat" placeholder="0" min="0" max="500">
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="btn-submit-meal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Add Entry
                </button>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="modal-settings">
        <div class="modal" role="dialog" aria-labelledby="modal-title-settings">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title-settings">Settings</h2>
                <button class="btn-close-modal" id="btn-close-settings-modal" aria-label="Close settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form class="modal-body" id="form-settings">
                <div class="form-group">
                    <label for="input-daily-goal">Daily Calorie Goal (kcal)</label>
                    <input type="number" id="input-daily-goal" placeholder="e.g. 2000" min="500" max="10000" required>
                </div>
                <div class="form-group">
                    <label for="input-user-name">Your Name (optional)</label>
                    <input type="text" id="input-user-name" placeholder="e.g. Alex" autocomplete="off">
                </div>
                <button type="submit" class="btn-submit" id="btn-save-settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save Settings
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span class="toast-message" id="toast-message"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
